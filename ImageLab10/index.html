<!doctype html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sky" src="assets/crazybeach.jpg" />
        <img id="sand" src="assets/sand.jpg" />
        <img id="waffle" src="assets/waffelcone.jpg" />
        <img id="stripes" src="assets/strippedfabric.jpeg" />
      </a-assets>


      <!-- THIS IS THE BEACH -->
      <a-plane
        src="#sand"
        rotation="-90 0 0"
        width="30"
        height="30"
        repeat="6 6"
      ></a-plane>

      
      <!-- An Entity is a container basically containing the objects 
       inside the <a-entity> thing! -->
      <!-- THIS IS A ICE CREAM -->

      <a-entity position="-2 0 -4">
        <a-cone
          src="#waffle"
          radius-bottom="0"
          radius-top="0.4"
          height="1.2"
          position="0 0.6 0"
        ></a-cone>
        <a-sphere color="#FFB6C1" radius="0.42" position="0 1.35 0"></a-sphere>
        <a-sphere color="#FFF5D6" radius="0.35" position="0 1.8 0"></a-sphere>
      </a-entity>

      <!-- THIS IS THE UMBRELLA -->

      <a-entity position="1.5 0 -5">
        <a-cylinder
          color="#FFFFFF"
          radius="0.05"
          height="2.5"
          position="0 1.25 0"
        ></a-cylinder>
        <a-cone
          src="#stripes"
          radius-bottom="1.6"
          radius-top="0"
          height="0.7"
          position="0 2.6 0"
        ></a-cone>
      </a-entity>

      <!-- THIS IS THE CASTLE -->

      <a-entity position="0 0 -7">
        <a-box
          src="#sand"
          width="2"
          height="1"
          depth="1.5"
          position="0 0.5 0"
        ></a-box>
        <a-cylinder
          src="#sand"
          radius="0.3"
          height="1.6"
          position="-1 0.8 0"
        ></a-cylinder>
        <a-cylinder
          src="#sand"
          radius="0.3"
          height="1.6"
          position="1 0.8 0"
        ></a-cylinder>
        <a-cone
          src="#sand"
          radius-bottom="0.35"
          radius-top="0"
          height="0.5"
          position="-1 1.85 0"
        ></a-cone>
        <a-cone
          src="#sand"
          radius-bottom="0.35"
          radius-top="0"
          height="0.5"
          position="1 1.85 0"
        ></a-cone>
      </a-entity>

      <a-sky src="#sky"></a-sky>
    </a-scene>
  </body>
</html>
